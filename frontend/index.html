<!doctype html>

<head>
  <meta charset="UTF-8" />
  <script>
    // ponytail: force redirect from http to https to prevent clientId changes and same-origin localstorage split (exclude local IPs)
    const hostname = window.location.hostname;
    const isLocal = hostname === "localhost" ||
      hostname.startsWith("127.") ||
      hostname.startsWith("192.168.") ||
      hostname.startsWith("10.") ||
      /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(hostname);

    if (window.location.protocol === "http:" && !isLocal) {
      window.location.href = "https://" + hostname + window.location.pathname + window.location.search + window.location.hash;
    }
  </script>
